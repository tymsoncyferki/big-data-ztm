# Single Compose project for a fresh, reproducible development environment.
# The simulator is opt-in via the "ingestion" profile and bootstrap flag.
# Project name is big-data-ztm; do not mix with a running portable stack.
name: big-data-ztm

services:
  hadoop-permissions:
    image: apache/hadoop:3.4.3
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "mkdir -p /nn/name /dn/data && chown -R hadoop:users /nn/name /dn/data"
    volumes:
      - hdfs_namenode:/nn
      - hdfs_datanode:/dn
    restart: "no"

  namenode:
    image: apache/hadoop:3.4.3
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "127.0.0.1:9870:9870"
    env_file: ./hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /data/name/current
    volumes:
      - hdfs_namenode:/data
    depends_on:
      hadoop-permissions:
        condition: service_completed_successfully
    restart: unless-stopped

  datanode:
    image: apache/hadoop:3.4.3
    hostname: datanode
    command: ["hdfs", "datanode"]
    ports:
      - "127.0.0.1:9864:9864"
    env_file: ./hadoop.env
    volumes:
      - hdfs_datanode:/data
    depends_on:
      hadoop-permissions:
        condition: service_completed_successfully
      namenode:
        condition: service_started
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: "CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  nifi:
    build:
      context: .
      dockerfile: docker/nifi/Dockerfile
    image: big-data-ztm-nifi:2.12.0-hadoop
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8083"
    environment:
      NIFI_JVM_HEAP_INIT: "512m"
      NIFI_JVM_HEAP_MAX: "1g"
      TZ: Europe/Warsaw
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Warsaw"
      # Accept browser access and localhost API bootstrap on the host.
      NIFI_WEB_PROXY_HOST: "localhost:8443,nifi:8443"
      SINGLE_USER_CREDENTIALS_USERNAME: "${NIFI_USERNAME:?Set NIFI_USERNAME in .env}"
      SINGLE_USER_CREDENTIALS_PASSWORD: "${NIFI_PASSWORD:?Set NIFI_PASSWORD in .env}"
      NIFI_SENSITIVE_PROPS_KEY: "${NIFI_SENSITIVE_PROPS_KEY:?Set NIFI_SENSITIVE_PROPS_KEY in .env}"
    depends_on:
      - namenode
      - kafka
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      # The bind mount keeps Hadoop configuration editable after the conf volume is initialized.
      - ./docker/nifi/hadoop-core-site.xml:/opt/nifi/nifi-current/conf/hadoop-core-site.xml:ro
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_logs:/opt/nifi/nifi-current/logs
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - nifi_python_extensions:/opt/nifi/nifi-current/python_extensions
      - nifi_state:/opt/nifi/nifi-current/state
    restart: unless-stopped

  # This service is NOT started by ordinary `docker compose up -d`.
  # Use `bash scripts/bootstrap.sh --with-data` to opt in after NiFi initialization.
  simulator:
    profiles: ["ingestion"]
    build:
      context: .
      dockerfile: docker/simulator/Dockerfile
    image: big-data-ztm-simulator:latest
    environment:
      WEATHER_API_TOKEN: "${WEATHER_API_TOKEN:-}"
      NIFI_GPS_URL: "http://nifi:8081/gps"
      NIFI_WEATHER_URL: "http://nifi:8082/weather"
      NIFI_AIR_URL: "http://nifi:8083/air-quality"
      TZ: Europe/Warsaw
    depends_on:
      nifi:
        condition: service_started
    restart: unless-stopped


  # One-off NiFi REST bootstrap; Python and requests stay inside Docker.
  nifi-init:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/nifi-init/Dockerfile
    image: big-data-ztm-nifi-init:latest
    environment:
      NIFI_API_URL: https://nifi:8443/nifi-api
      NIFI_USERNAME: "${NIFI_USERNAME:?Set NIFI_USERNAME in .env}"
      NIFI_PASSWORD: "${NIFI_PASSWORD:?Set NIFI_PASSWORD in .env}"
    volumes:
      - ./scripts/init-nifi.py:/bootstrap/scripts/init-nifi.py:ro
      - ./nifi/flows:/bootstrap/nifi/flows:ro
    depends_on:
      nifi:
        condition: service_started
    restart: "no"

  # Spark-only image for manual and scheduled batch jobs.
  # The scheduler never mounts /var/run/docker.sock.
  batch-runner:
    profiles: ["analytics"]
    build:
      context: .
      dockerfile: docker/batch/Dockerfile
    image: big-data-ztm-batch:latest
    command: ["python3", "-u", "/opt/project/scripts/container_scheduler.py", "--once"]
    environment: &batch_environment
      PYSPARK_PYTHON: python3
      PYTHONUNBUFFERED: "1"
      SPARK_LOCAL_HOSTNAME: localhost
      HDFS_BASE: hdfs://namenode:8020
      SPARK_LOCALITY_WAIT: "${SPARK_LOCALITY_WAIT:-0s}"
      SPARK_SCHEDULER_DEBUG: "${SPARK_SCHEDULER_DEBUG:-0}"
      TZ: Europe/Warsaw
    volumes: &batch_volumes
      - ./spark:/opt/project/spark:ro
      - ./scripts/container_scheduler.py:/opt/project/scripts/container_scheduler.py:ro
      - batch_lock:/var/lock/ztm
    depends_on:
      namenode:
        condition: service_started
    restart: "no"

  batch-scheduler:
    profiles: ["scheduler"]
    image: big-data-ztm-batch:latest
    command: ["python3", "-u", "/opt/project/scripts/container_scheduler.py", "--loop"]
    environment: *batch_environment
    volumes: *batch_volumes
    depends_on:
      namenode:
        condition: service_started
    restart: unless-stopped

  # sends healthchecks.io pings every 15 minutes (URLs from .env)
  heartbeat:
    profiles: ["scheduler"]
    image: apache/hadoop:3.4.3
    command: ["bash", "/opt/project/scripts/heartbeat.sh"]
    env_file: ./hadoop.env
    environment:
      HC_DOCKER_URL: "${HC_DOCKER_URL:-}"
      HC_DATA_URL: "${HC_DATA_URL:-}"
    volumes:
      - ./scripts/heartbeat.sh:/opt/project/scripts/heartbeat.sh:ro
    depends_on:
      namenode:
        condition: service_started
    restart: unless-stopped

volumes:
  nifi_conf:
  nifi_content_repository:
  nifi_database_repository:
  nifi_flowfile_repository:
  nifi_logs:
  nifi_provenance_repository:
  nifi_python_extensions:
  nifi_state:
  hdfs_namenode:
  hdfs_datanode:
  kafka_data:
  batch_lock:
